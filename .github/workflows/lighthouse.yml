# Lighthouse (mobile) on every successful Vercel preview deployment. Fails if
# performance or accessibility drops below 90 (see lighthouserc.json).
# Vercel previews must be publicly reachable: if Vercel Authentication is on
# for previews, this job gets a login page instead of the app.
name: Lighthouse

on: deployment_status

permissions:
  contents: read

jobs:
  lighthouse:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.deployment_status.target_url }}/?type=enrol
            ${{ github.event.deployment_status.target_url }}/centres/290
          configPath: ./lighthouserc.json
          uploadArtifacts: true
