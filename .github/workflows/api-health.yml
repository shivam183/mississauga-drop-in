# Nightly check that the unofficial ActiveNet API still returns what the app
# expects (8 throttled requests). A failed run emails the repo's watchers, so a
# breaking change on the City's side is noticed before users notice it.
name: API health

on:
  schedule:
    - cron: "17 10 * * *" # 10:17 UTC, early morning in Toronto
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check-api
