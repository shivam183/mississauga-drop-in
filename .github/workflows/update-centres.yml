# Weekly refresh of data/centres.*.json from the City's centre lists. Opens
# (or updates) a pull request only when a list actually changed.
name: Update centres

on:
  schedule:
    - cron: "41 11 * * 1" # Mondays 11:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run update-centres
      - uses: peter-evans/create-pull-request@v8
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger CI; the same
          # token as release-please lets this PR get its checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: bot/update-centres
          delete-branch: true
          add-paths: data/centres.*.json
          commit-message: "chore(data): update centre lists"
          title: "chore(data): update centre lists"
          body: |
            The City's centre lists changed. Generated by `npm run update-centres`
            in the weekly **Update centres** workflow.
