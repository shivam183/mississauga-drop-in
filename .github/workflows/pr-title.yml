# PRs are squash-merged, so the PR title becomes the commit message on main.
# release-please reads those messages, so titles must follow Conventional
# Commits, e.g. "feat: add centre filter" or "fix(enrol): handle full sessions".
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            style
            revert
          requireScope: false
